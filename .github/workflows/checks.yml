name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Interface state and presentation checks
        run: |
          python bridge/tests/presentation_prepare_test.py
          for test in screen_interface scene_detector command_controller move_cards battle_menu_exit; do
            g++ -std=c++20 -O2 -Iazahar/src bridge/tests/${test}_test.cpp -o /tmp/px-${test}
            /tmp/px-${test}
          done
      - name: App locale checks
        run: |
          mkdir -p /tmp/px-java
          javac -d /tmp/px-java android/java/org/pokemonx/recomp/I18n.java android/tests/I18nTest.java
          java -cp /tmp/px-java org.pokemonx.recomp.I18nTest
